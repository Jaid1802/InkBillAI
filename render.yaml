services:
  - type: web
    name: inkbill-ocr-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: OCR_API_KEY
        generateValue: true
      - key: OCR_MODEL_TYPE
        value: server