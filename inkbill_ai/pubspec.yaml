name: inkbill_ai
description: A production-quality Flutter application for stylus-first digital ink billing with AI recognition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.6
  path: ^1.9.0

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.4.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0

  # Printing & Sharing
  printing: ^5.12.0
  pdf: ^3.10.4
  share_plus: ^9.0.0
  open_file: ^3.3.2

  # AI Recognition (interfaces - implementations are injected)
  google_mlkit_digital_ink_recognition: ^0.12.0
  tflite_flutter: ^0.10.4

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Cloud Platform
  supabase_flutter: ^2.5.0
  perfect_freehand: ^2.5.2+1
  image: ^4.9.1
  google_mlkit_text_recognition: ^0.13.1
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4
  mocktail: ^1.0.3
  sqflite: ^2.3.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/fonts/
